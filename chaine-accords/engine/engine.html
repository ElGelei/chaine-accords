<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promenade d’accords – prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2efe9; --fg:#1d1a22; --muted:#5d5866; --btn:#1d1a22; --btn-fg:#f7f3ea; --btn2:#e3ded5; --btn2-fg:#1d1a22;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#121016; --fg:#efeaf4; --muted:#aaa3b6; --btn:#efeaf4; --btn-fg:#121016; --btn2:#26222d; --btn2-fg:#efeaf4; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#121016; --fg:#efeaf4; --muted:#aaa3b6; --btn:#efeaf4; --btn-fg:#121016; --btn2:#26222d; --btn2-fg:#efeaf4; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:Inter, system-ui, -apple-system, sans-serif;
  display:flex; flex-direction:column; align-items:center; gap:14px; padding:12px 16px 20px}
.stage{position:relative; aspect-ratio:9/16; height:min(74vh, calc((100vw - 32px) * 16 / 9)); max-width:100%; border-radius:14px; overflow:hidden; background:#000; container-type:size}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#c{image-rendering:pixelated; image-rendering:crisp-edges}
.title{position:absolute; left:0; right:0; top:6.5%; display:flex; justify-content:center; align-items:baseline; gap:0.06em; color:#f8efe6;
  font-family:Inter, system-ui, sans-serif; text-shadow:0 0 24px rgba(255,220,190,.25); pointer-events:none; transition:opacity .35s}
.title .root{font-size:11cqh; font-weight:600; letter-spacing:-0.03em; line-height:1}
.title .qual{font-size:5.2cqh; font-weight:600; letter-spacing:-0.01em}
.title.swap{opacity:.15}
.cad{position:absolute; left:0; right:0; top:17.5%; text-align:center; font-family:Inter, system-ui, sans-serif; font-weight:600; font-size:2.6cqh;
  letter-spacing:.08em; text-transform:uppercase; color:#ffd88a; text-shadow:0 0 14px rgba(255,200,120,.5); opacity:0; transition:opacity .5s; pointer-events:none}
.cad.on{opacity:1}
.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
button{font:inherit; font-weight:600; font-size:15px; min-height:44px; padding:0 18px; border-radius:999px; border:0; cursor:pointer}
.primary{background:var(--btn); color:var(--btn-fg)}
.secondary{background:var(--btn2); color:var(--btn2-fg)}
.info{margin:0; font-size:14px; color:var(--muted); text-align:center}
.emos{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:560px}
.chip{background:var(--btn2); color:var(--btn2-fg); font-size:14px; padding:0 14px}
.chip.on{background:var(--btn); color:var(--btn-fg)}
.prog{margin:0; max-width:560px; font-size:13px; line-height:1.7; color:var(--muted); text-align:center}
.prog span.on{color:var(--fg); font-weight:700}
.prog span.peak{text-decoration:underline; text-decoration-color:#e0a83a; text-decoration-thickness:2px; text-underline-offset:3px}
html.render body{padding:0; gap:0; background:#000}
html.render .stage{height:100vh; width:100vw; border-radius:0}
html.render .controls, html.render .emos, html.render .info, html.render .prog{display:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" width="90" height="160" role="img" aria-label="Une petite fille en pixel art marche vers la droite sous des lignes de voix lumineuses qui défilent"></canvas>
  <canvas id="o" aria-hidden="true"></canvas>
  <div class="title" id="title" aria-live="polite"><span class="root" id="root">D♭</span><span class="qual" id="qual">maj9</span></div>
  <div class="cad" id="cad"></div>
</div>
<div class="controls">
  <button class="primary" id="play">▶ Activer le son</button>
  <button class="secondary" id="next">Décor suivant</button>
</div>
<div class="emos" id="emos" role="group" aria-label="Grille d’accords"></div>
<div class="emos" id="sounds" role="group" aria-label="Timbre"></div>
<p class="info" id="info"></p>
<p class="prog" id="prog"></p>

function bakeFrame(rows){
  const w=rows[0].length+2, h=rows.length+2, c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  const grid={};
  rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ if(SPAL[r[x]]) grid[(x+1)+','+(y+1)]=r[x]; } });
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=grid[x+','+y];
    if(ch){ g.fillStyle=SPAL[ch]; g.fillRect(x,y,1,1); continue; }
    if(grid[x+','+(y+1)]||grid[x+','+(y-1)]||grid[(x+1)+','+y]||grid[(x-1)+','+y]){ g.fillStyle=SOUT; g.fillRect(x,y,1,1); }

    if(!off){ v.vg.gain.cancelScheduledValues(now); v.vg.gain.setValueAtTime(v.vg.gain.value,now); }

    else { v.vg.gain.linearRampToValueAtTime(v.base*0.75,now+0.2); v.vg.gain.linearRampToValueAtTime(v.base,now+1.0); }
  });
  strike(notes,climax,at);
}
document.getElementById('play').addEventListener('click',async e=>{
  if(!actx) initAudio();
  if(actx.state==='suspended') await actx.resume();
  const now=actx.currentTime;
  master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value,now);
  audioOn=!audioOn;
  master.gain.linearRampToValueAtTime(audioOn?0.85:0,now+(audioOn?2:0.8));
  e.currentTarget.textContent=audioOn?'❚❚ Couper le son':'▶ Activer le son';
});

/* ---------- Thème suivant ---------- */
let fade=null;
document.getElementById('next').addEventListener('click',()=>{ if(!fade) fade={t:0,switched:false}; });

/* ---------- État ---------- */
let scroll=0, tAll=0, last=performance.now(), lastIdx=-1;
let hopT=99, glowT=99, particles=[], weather=[];
const titleEl=document.getElementById('title'), rootEl=document.getElementById('root'), qualEl=document.getElementById('qual');
function setTheme(i){ themeIdx=i; staticLayer=buildStatic(THEMES[i]); weather=[]; updateInfo(); }
function updateInfo(){ if(!SEQ.length) return; if(curEmo==='rule'||PRESETS[curEmo]){ document.getElementById('info').textContent=(PRESETS[curEmo]?'Modèle '+PRESETS[curEmo].label:'Suite générée')+' · '+keyLabel+(spiceUsed?' · épice : '+SPICE_LABEL[spiceUsed]:' · sans épice'); return; } const lab=LOOPS[curEmo]?LOOPS[curEmo].label+' · '+keyLabel:SONGS[curEmo]?'Grille de '+keyLabel:EMOS[curEmo].label+' · '+keyLabel; document.getElementById('info').textContent=lab+' · '+N+' accords · '+THEMES[themeIdx].name; }
function renderProg(){
  const el=document.getElementById('prog'); el.textContent='';
  SEQ.forEach((c,i)=>{ const sp=document.createElement('span'); sp.textContent=c.ro?c.name+' ('+c.ro+')':c.name; if(c.climax) sp.className='peak'; el.appendChild(sp); if(i<N-1) el.appendChild(document.createTextNode(' · ')); });
}
setTheme(0);

function triggerChord(ch){
  curChord=ch; hopT=0; glowT=0;
  titleEl.classList.add('swap');
  setTimeout(()=>{ rootEl.textContent=ch.root; qualEl.textContent=ch.qual; titleEl.classList.remove('swap'); },180);
  const cadEl=document.getElementById('cad'); if(ch.cad){ cadEl.textContent=ch.cad; cadEl.classList.add('on'); } else cadEl.classList.remove('on');
  document.querySelectorAll('#prog span').forEach((sp,j)=>sp.classList.toggle('on',j===ch.i));
  const th=THEMES[themeIdx], n=ch.climax?32:14;
  for(let k=0;k<n;k++){
    const a=-Math.PI/2+(Math.random()-.5)*(ch.climax?3:2.2), sp=(ch.climax?14:9)+Math.random()*14;
    particles.push({x:W/2,y:GY-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.1+Math.random()*(ch.climax?1.4:.8),c:th.burst[k%th.burst.length],cross:k%4===0});
  }
  glideTo(ch.notes,ch.climax);
}

/* ---------- Couches pixel ---------- */
function drawFar(th){
  const f=th.far, off=scroll*f.p;
  for(let x=0;x<W;x++){
    const wx=x+off, h=Math.round(f.base-f.amp*(Math.sin(wx*f.f)+0.5*Math.sin(wx*f.f*2.3+1.3)+0.6));
    R(x,h,1,GY-h+1,f.c);
    if(f.cap){ const peak=f.base-f.amp*1.6; if(h<peak+4) R(x,h,1,2,f.cap); }
  }
}
function drawSea(th){
  R(0,th.hz,W,GY-th.hz,th.sea.c);
  for(let k=0;k<14;k++){
    const y=th.hz+2+((k*3)%(GY-th.hz-3)), dir=k%2?1:-1;
    let x=(hash(k)*W+tAll*4*dir+scroll*.2)%W; if(x<0)x+=W;
    R(x,y,2+Math.floor(hash(k+7)*4),1,th.sea.shine);
  }
  if(th.moon){ for(let y=th.hz+1;y<GY;y+=2){ if(Math.sin(tAll*3+y)>-.2) R(th.moon.x-1+Math.round(Math.sin(y+tAll*2)),y,3,1,'#cfd8ea'); } }
}
function drawMid(th){
  const m=th.mid; if(!m) return;
  if(m.type==='wheat'){
    R(0,m.base,W,GY-m.base,m.c);
    for(let x=0;x<W;x+=2){ const wx=Math.floor(x+scroll*m.p); const sway=Math.sin(tAll*2+wx*.25)>.5?1:0; R(x+sway,m.base-1-(hash(wx)>.5?1:0),1,2,m.cap); }
    return;
  }
  const sp=m.type==='pine'?17:21, off=scroll*m.p, first=Math.floor(off/sp)-1;
  for(let i=first;i<first+W/sp+3;i++){
    if(hash(i*3.7)<.25) continue;
    const x=i*sp-off+Math.floor(hash(i)*6), s=hash(i+11);
    if(m.type==='round'){ const r=4+Math.round(s*3); R(x+r-1,m.base-5,2,5,m.c); disc(ctx,x+r,m.base-6-r,r,m.c); }
    else { const hgt=12+Math.round(s*8); R(x+5,m.base-3,2,3,'#2b3f42');
      for(let r=0;r<hgt;r++){ const w=1+Math.floor(r*0.7)*2; R(x+6-Math.floor(w/2),m.base-3-hgt+r,w,1,(r%4===0&&r>1)?m.cap:m.c);} }
  }
}
function drawGround(th){
  const g=th.ground; R(0,GY,W,H-GY,g.fill); R(0,GY,W,2,g.top);
  const sp=6, first=Math.floor(scroll/sp)-1;
  for(let i=first;i<first+W/sp+3;i++){
    if(hash(i)<.45) continue;
    const x=i*sp-scroll, y=GY+3+Math.floor(hash(i+9)*(H-GY-6)), c=g.deco[Math.floor(hash(i+4)*g.deco.length)];
    if(g.kind==='flower'){ R(x,y,1,1,c); R(x,y+1,1,1,'#3d5a3f'); }
    else if(g.kind==='shell'||g.kind==='stone'){ R(x,y,2,1,c); }
    else { R(x,y,1,2,c); R(x+1,y+1,1,1,c); }
  }
}
function updateWeather(th,dt){
  if(!th.weather) return;
  const target=th.weather==='snow'?40:th.weather==='fireflies'?14:10;
  while(weather.length<target) weather.push({x:Math.random()*W,y:th.weather==='snow'?Math.random()*-H:Math.random()*GY,ph:Math.random()*6,s:Math.random()});
  weather.forEach(p=>{
    if(th.weather==='snow'){ p.y+=(6+p.s*8)*dt; p.x+=(Math.sin(tAll+p.ph)*3-4)*dt; if(p.y>H){p.y=-2;p.x=Math.random()*W;} if(p.x<0)p.x+=W; R(p.x,p.y,1,1,p.s>.7?'#ffffff':'#eef4fb'); }
    else if(th.weather==='fireflies'){ p.x+=(Math.sin(tAll*.7+p.ph)*3-6)*dt; p.y+=Math.cos(tAll*.9+p.ph)*2*dt; if(p.x<0)p.x+=W; if(Math.sin(tAll*2.5+p.ph*3)>0) R(p.x,p.y,1,1,'#ffe9a0'); }
    else { p.x+=(-8+Math.sin(tAll+p.ph)*2)*dt; p.y+=Math.sin(tAll*1.3+p.ph)*2*dt; if(p.x<0)p.x+=W; R(p.x,p.y,1,1,'#fffaf0'); }
  });
}
function drawStarsTwinkle(th){
  if(!th.stars) return;
  for(let s=0;s<8;s++){ if(Math.sin(tAll*3+s*2.1)>.6) R(Math.floor(hash(s)*W),Math.floor(hash(s+50)*th.hz*.85),1,1,'#ffffff'); }
}

/* ---------- Surcouche : lignes de voix ---------- */
const ov=document.getElementById('o'), o=ov.getContext('2d');
let OW=1,OH=1,dpr=1;
function sizeOv(){ dpr=Math.min(window.devicePixelRatio||1,2); const r=ov.getBoundingClientRect(); OW=ov.width=Math.max(1,Math.round(r.width*dpr)); OH=ov.height=Math.max(1,Math.round(r.height*dpr)); }
new ResizeObserver(sizeOv).observe(ov); sizeOv();
const NN=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const nname=m=>SPELL[((m%12)+12)%12]+(Math.floor(m/12)-1);
/* Chaque voix a son couloir : on garde le mouvement mélodique, mais les voix restent bien séparées */
const LANE_TOP=0.27, LANE_GAP=0.074, SEMI=0.007;
let MEAN=[40,58,62,65,69];
const laneY=(v,p)=>OH*(LANE_TOP+(4-v)*LANE_GAP-(p-MEAN[v])*SEMI);
const smooth=u=>{u=Math.max(0,Math.min(1,u)); return u*u*(3-2*u);};
function vp(v,t){ const s=t+0.25, g=idxAt(s), u=(s-startG(g))/0.8; const a=chordG(g-1).notes[v], b=chordG(g).notes[v]; return a+(b-a)*smooth(u); }
const rgba=(hex,a)=>'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')';
const VC=['#ff7a5c','#ffa24a','#ffd25a','#c8f07a','#fff6c8'];

function drawOverlay(){
  o.clearRect(0,0,OW,OH);
  const g=o.createLinearGradient(0,0,0,OH*0.8);
  g.addColorStop(0,'rgba(6,4,12,0.66)'); g.addColorStop(0.72,'rgba(6,4,12,0.4)'); g.addColorStop(1,'rgba(6,4,12,0)');
  o.fillStyle=g; o.fillRect(0,0,OW,OH*0.8);

  const playX=OW*0.5, pps=OW*0.13, top=OH*0.215, bot=OH*0.6, thin=Math.max(1,Math.round(dpr*0.75));
  const fs=Math.round(OH*0.024);
  o.font='600 '+fs+'px Inter, system-ui, sans-serif'; o.textBaseline='alphabetic';
  const T=tAll-songStart;
  const cur=idxAt(T), tL=T-playX/pps, tR=T+(OW-playX)/pps;
  for(let k=idxAt(tL)-1;k<=idxAt(tR)+1;k++){
    const c=chordG(k), x=Math.round(playX+(startG(k)-T)*pps), isCur=k===cur;
    o.fillStyle='rgba(255,255,255,'+(isCur?0.2:0.09)+')'; o.fillRect(x,top+fs*0.6,thin,bot-top);
    o.fillStyle=c.climax?'rgba(255,214,120,'+(isCur?1:0.6)+')':'rgba(255,236,220,'+(isCur?0.9:0.4)+')'; o.fillText(c.name,x+fs*0.4,top);
  }

  const step=3*dpr; o.lineJoin='round'; o.lineCap='round';
  for(let v=0;v<5;v++){
    const col=VC[v];
    /* chemin à venir : pointillés discrets */
    o.beginPath();
    for(let x=playX;x<=OW+step;x+=step){ const y=laneY(v,vp(v,T+(x-playX)/pps)); x===playX?o.moveTo(x,y):o.lineTo(x,y); }
    o.strokeStyle=rgba(col,0.45); o.lineWidth=2.2*dpr; o.stroke();
    /* traînée lumineuse qui s'estompe vers la gauche */
    o.beginPath();
    for(let x=0;x<playX;x+=step){ const y=laneY(v,vp(v,T+(x-playX)/pps)); x===0?o.moveTo(x,y):o.lineTo(x,y); }
    o.lineTo(playX,laneY(v,vp(v,T)));
    const tg=o.createLinearGradient(0,0,playX,0); tg.addColorStop(0,rgba(col,0.15)); tg.addColorStop(0.3,rgba(col,0.85)); tg.addColorStop(1,rgba(col,1));
    o.strokeStyle=tg; o.lineWidth=6*dpr; o.shadowColor=col; o.shadowBlur=26*dpr; o.stroke(); o.stroke(); o.shadowBlur=0;
    const cg=o.createLinearGradient(0,0,playX,0); cg.addColorStop(0,'rgba(255,255,255,0)'); cg.addColorStop(0.4,'rgba(255,255,255,0.7)'); cg.addColorStop(1,'rgba(255,255,255,0.95)');
    o.strokeStyle=cg; o.lineWidth=1.8*dpr; o.stroke();
    /* pollen lumineux semé le long de la traînée */
    const q=0.22, t0=Math.floor(T/q)*q;
    for(let k=1;k<26;k++){
      const t=t0-k*q+ (v*0.037), x=playX+(t-T)*pps; if(x<0) break;
      const age=(T-t), y=laneY(v,vp(v,t))+Math.sin(t*9+v)*3*dpr-age*2*dpr;
      const a=Math.max(0,1-age/4)*(0.6+0.4*Math.sin(t*23+v*3+tAll*6));
      if(a<=0.02) continue;
      o.fillStyle=rgba(col,a); o.beginPath(); o.arc(x,y,2.2*dpr,0,Math.PI*2); o.fill();
    }
  }

  /* les lucioles */
  const lfs=Math.round(OH*0.032);
  o.font='700 '+lfs+'px Inter, system-ui, sans-serif';
  o.textBaseline='middle';
  for(let v=0;v<5;v++){
    const col=VC[v], p=vp(v,T), x=playX, y=laneY(v,p)+Math.sin(tAll*2.2+v*1.7)*1.5*dpr;
    const pulse=0.75+0.25*Math.sin(tAll*4.5+v*1.3)+(glowT<0.6?(0.6-glowT)*0.8:0);
    const R1=30*dpr*pulse;
    const halo=o.createRadialGradient(x,y,0,x,y,R1); halo.addColorStop(0,rgba(col,0.85)); halo.addColorStop(0.35,rgba(col,0.35)); halo.addColorStop(1,rgba(col,0));
    o.fillStyle=halo; o.beginPath(); o.arc(x,y,R1,0,Math.PI*2); o.fill();
    /* petites ailes */
    const flap=Math.abs(Math.sin(tAll*18+v));
    o.fillStyle='rgba(255,255,255,'+(0.25+0.25*flap)+')';
    o.beginPath(); o.ellipse(x-3.5*dpr,y-6*dpr,5.5*dpr,(1.5+2.5*flap)*dpr,-0.6,0,Math.PI*2); o.fill();
    o.beginPath(); o.ellipse(x+2*dpr,y-6.5*dpr,5.5*dpr,(1.5+2.5*flap)*dpr,0.5,0,Math.PI*2); o.fill();
    o.shadowColor=col; o.shadowBlur=24*dpr; o.fillStyle=col; o.beginPath(); o.arc(x,y,7*dpr,0,Math.PI*2); o.fill(); o.fill();
    o.shadowBlur=0; o.fillStyle='#ffffff'; o.beginPath(); o.arc(x,y,3.4*dpr,0,Math.PI*2); o.fill();
    o.fillStyle=col; o.shadowColor='rgba(0,0,0,0.6)'; o.shadowBlur=6*dpr; o.fillText(nname(Math.round(p)),x+20*dpr,y); o.shadowBlur=0;
  }
}

/* ---------- Boucle ---------- */
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now; step(dt);
  requestAnimationFrame(loop);
}
function step(dt){
  tAll+=dt;
  scroll+=14*dt;
  const idx=idxAt(tAll-songStart); if(idx!==lastIdx){ lastIdx=idx; triggerChord(chordG(idx)); }
  hopT+=dt; glowT+=dt;
  if(fade){ fade.t+=dt; if(!fade.switched && fade.t>=.35){ fade.switched=true; setTheme(fade.to!==undefined?fade.to:(themeIdx+1)%THEMES.length); } if(fade.t>=.7) fade=null; }

  const th=THEMES[themeIdx];
  ctx.drawImage(staticLayer,0,0);
  drawStarsTwinkle(th); drawFar(th); if(th.sea) drawSea(th); drawMid(th); drawGround(th); updateWeather(th,dt);

  const hop=hopT<.4?Math.round(Math.sin(Math.PI*hopT/.4)*3):0;
  const f=hop>0?1:Math.floor(tAll/.2)%4;
  const gx=Math.round(W/2-SPR_W/2), gy=GY+2-SPR_H-hop+FRAMES[f].bob;
  if(glowT<1){ ctx.globalAlpha=0.3*(1-glowT); disc(ctx,W/2,GY-10-hop,12+Math.round(glowT*5),'#fff6d6'); ctx.globalAlpha=1; }
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(gx+6,GY+1,10,1);
  drawGirl(gx,gy,f);

  particles=particles.filter(p=>(p.life-=dt)>0);
  particles.forEach(p=>{
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=4*dt; p.vx*=0.985;
    if(p.life<.4 && Math.floor(tAll*20)%2) return;
    R(p.x,p.y,1,1,p.c);
    if(p.cross && p.life>.6){ R(p.x-1,p.y,1,1,p.c); R(p.x+1,p.y,1,1,p.c); R(p.x,p.y-1,1,1,p.c); R(p.x,p.y+1,1,1,p.c); }
  });
  if(fade){ const a=fade.t<.35?fade.t/.35:1-(fade.t-.35)/.35; ctx.fillStyle='rgba(8,6,12,'+Math.max(0,Math.min(1,a))+')'; ctx.fillRect(0,0,W,H); }

  drawOverlay();
}
const emosEl=document.getElementById('emos');
function drawChips(){
  emosEl.textContent='';
  const mk=(txt,on,fn,primary)=>{ const b=document.createElement('button'); b.className='chip'+(on?' on':''); b.textContent=txt; b.setAttribute('aria-pressed',!!on); b.addEventListener('click',()=>{ fn(); drawChips(); }); emosEl.appendChild(b); };
  mk('↻ Nouvelle suite (majeur)',curEmo==='rule'&&genMode==='maj',()=>generateRule('maj'));
  mk('↻ Nouvelle suite (mineur)',curEmo==='rule'&&genMode==='min',()=>generateRule('min'));
  Object.keys(PRESETS).forEach(k=>mk(PRESETS[k].label,curEmo===k,()=>playPreset(k)));
}
const soundsEl=document.getElementById('sounds');
function drawSounds(){
  soundsEl.textContent='';
  Object.keys(SOUNDS).forEach(k=>{ const b=document.createElement('button'); b.className='chip'+(k===soundMode?' on':''); b.textContent='Son : '+SOUNDS[k].label; b.setAttribute('aria-pressed',k===soundMode);
    b.addEventListener('click',()=>{ setSound(k); drawSounds(); }); soundsEl.appendChild(b); });
}
if(!RENDER){ generateRule('maj'); drawChips(); drawSounds(); requestAnimationFrame(loop); }
else {
  const mode=QS.get('mode')||(Math.random()<0.75?'maj':'min');
  generateRule(mode); fade=null;
  const th=QS.has('theme')?+QS.get('theme'):(mode==='maj'?pick([0,1,3]):2); setTheme(th);
  window.__frame=dt=>step(dt);
  window.__meta={duration:TOTAL, key:keyLabel, mode, spice:spiceUsed?SPICE_LABEL[spiceUsed]:'', theme:THEMES[themeIdx].name,
    chords:SEQ.map(c=>({name:c.name, degree:c.ro, start:+c.start.toFixed(3), dur:+c.dur.toFixed(3)}))};
  window.__renderAudio=async()=>{
    const sr=44100, dur=TOTAL+1.5;
    voices=[]; curChord=SEQ[0];
    initAudio(new OfflineAudioContext(2,Math.ceil(sr*dur),sr));
    master.gain.setValueAtTime(0,0); master.gain.linearRampToValueAtTime(0.85,1.2);
    master.gain.setValueAtTime(0.85,dur-1.6); master.gain.linearRampToValueAtTime(0,dur);
    SEQ.forEach(c=>glideTo(c.notes,c.climax,c.start));
    const buf=await actx.startRendering();
    const L=buf.getChannelData(0), Rr=buf.getChannelData(1); let peak=1e-6;
    for(let i=0;i<L.length;i++){ peak=Math.max(peak,Math.abs(L[i]),Math.abs(Rr[i])); }
    const g=Math.min(0.89/peak,6), n=L.length, out=new DataView(new ArrayBuffer(44+n*4));
    const w=(o,str)=>{ for(let i=0;i<str.length;i++) out.setUint8(o+i,str.charCodeAt(i)); };
    w(0,'RIFF'); out.setUint32(4,36+n*4,true); w(8,'WAVE'); w(12,'fmt '); out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,2,true);
    out.setUint32(24,sr,true); out.setUint32(28,sr*4,true); out.setUint16(32,4,true); out.setUint16(34,16,true); w(36,'data'); out.setUint32(40,n*4,true);
    for(let i=0;i<n;i++){ out.setInt16(44+i*4,Math.max(-1,Math.min(1,L[i]*g))*32767,true); out.setInt16(46+i*4,Math.max(-1,Math.min(1,Rr[i]*g))*32767,true); }
    const bytes=new Uint8Array(out.buffer); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    return btoa(bin);
  };
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ step(0.001); window.__ready=true; });
}
})();
</script>
