name: Publication quotidienne
on:
  # GitHub may delay or drop a scheduled run: several attempts per evening,
  # the guard below makes sure only the first one actually publishes.
  schedule:
    - cron: '17 16 * * *'   # 17:17 Paris (winter time)
    - cron: '47 16 * * *'   # 17:47
    - cron: '23 17 * * *'   # 18:23
    - cron: '53 17 * * *'   # 18:53
    - cron: '37 18 * * *'   # 19:37
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier vraiment sur les réseaux ?'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: quotidien
jobs:
  garde:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: check
        run: |
          TODAY=$(TZ=Europe/Paris date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && jq -e --arg d "$TODAY" 'any(.[]; .date == $d)' state/historique.json >/dev/null; then
            echo "Déjà publié aujourd'hui ($TODAY) : rien à faire."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  quotidien:
    needs: garde
    if: needs.garde.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publier) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dépendances
        run: npm install && npx playwright install --with-deps chromium

      - name: Rendu de la vidéo du jour (3 essais)
        run: |
          for i in 1 2 3; do
            node render/render.mjs && node render/qc.mjs && exit 0
            echo "Essai $i raté, nouvel essai dans 30 s"; sleep 30
          done
          exit 1

      - name: Mise en ligne publique de la vidéo (release GitHub)
        id: release
        if: env.PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(jq -r .date out/video.json)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "$(jq -r '.key + " · " + ([.chords[].name] | join(" "))' out/video.json)"
          gh release upload "$TAG" out/video.mp4 --clobber
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" >> "$GITHUB_OUTPUT"
          # keep only the 14 latest releases
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^video-' | sort -r | tail -n +15 | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Publication (ou répétition si « publier » n'est pas coché)
        env:
          DRY_RUN: ${{ env.PUBLISH == '1' && '0' || '1' }}
          VIDEO_URL: ${{ steps.release.outputs.url }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: node render/publish.mjs

      - name: Enregistrer l'historique
        if: always() && env.PUBLISH == '1'
        run: |
          git config user.name "chaine-accords-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Historique : vidéo du $(date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

      - name: Vidéo en téléchargement
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-du-jour
          path: |
            out/video.mp4
            out/video.json
          retention-days: 14
          if-no-files-found: ignore
